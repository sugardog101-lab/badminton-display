name = "mackypazoo-ai"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# For shared report storage, create KV and uncomment:
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "REPLACE_WITH_YOUR_KV_ID"

[vars]
YOUTUBE_HANDLE = "MACKYPAZOO"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
